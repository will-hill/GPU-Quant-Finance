[project]
name = "gpu-options-scanner"
version = "0.1.0"
description = "Continuous American-options scanner -- live Theta Data, IV + 6 Greeks on GPU"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cupy-cuda13x>=14.1.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "numba>=0.67.0",
    "numba-cuda[cu13]>=0.30.4",
    "numpy<2.5",
    "pandas>=2.3.3",
    "polars>=1.20",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.2",
    "quantlib>=1.43",
    "scipy>=1.18.1",
    "thetadata>=1.0.9",
    "torch>=2.13.0",
]
